name: Deploy Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloud-run-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: finalproj-orianaziz
  PROJECT_NUMBER: "799658247857"
  REGION: us-central1
  SERVICE: leaklock-api
  RUNTIME_SERVICE_ACCOUNT: 799658247857-compute@developer.gserviceaccount.com
  DEPLOY_SERVICE_ACCOUNT: github-actions-deploy@finalproj-orianaziz.iam.gserviceaccount.com
  WORKLOAD_IDENTITY_PROVIDER: projects/799658247857/locations/global/workloadIdentityPools/github-actions/providers/leaklock

jobs:
  deploy:
    name: Deploy API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          region: ${{ env.REGION }}
          service: ${{ env.SERVICE }}
          source: .
          env_vars: |-
            LEAKLOCK_REALTIME_MODE=1
            LEAKLOCK_SKIP_STARTUP_WARMUP=1
          env_vars_update_strategy: merge
          flags: >-
            --memory=8Gi
            --cpu=2
            --timeout=60
            --min-instances=1
            --service-account=${{ env.RUNTIME_SERVICE_ACCOUNT }}
            --allow-unauthenticated

      - name: Smoke test
        run: curl --fail --show-error --silent "${{ steps.deploy.outputs.url }}/health"
